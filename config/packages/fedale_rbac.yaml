# Roles, permissions and assignments in the auth_* tables (fedale/rbac-bundle).
# The permissions the application checks are created by App\Module\Access (access:sync).
fedale_rbac:
    enabled: true
    # Holders of this role pass every check.
    super_admin_role: '%app.super_admin_role%'
    # Role → role edges come from auth_item_child, not from security.yaml.
    override_role_hierarchy: true
    # Assigned roles are loaded by our user provider itself.
    inject_assigned_roles: false
    provider: doctrine

    # Each tenant has its own auth_* tables, in its RBAC schema (see docs/architecture.md,
    # "Tenants"): the context only tells the bundle which tenant they are, so that its cache
    # and its graphs in memory are kept per tenant. No scoped_assignments: that is for tables
    # shared by every tenant.
    tenancy:
        context: App\Shared\Infrastructure\Tenant\RbacTenantContext

    # The roles and permissions of each tenant under its own key (fedale_rbac.items.<tenant id>).
    # Nothing read inside an open transaction is cached. The tests' pool is in memory (cache.yaml):
    # their transactions, rolled back, are opened where the bundle doesn't see them.
    cache:
        enabled: true
        pool: rbac.cache
