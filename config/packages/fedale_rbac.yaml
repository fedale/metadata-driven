# Roles, permissions and assignments in the auth_* tables (fedale/rbac-bundle).
# The permissions the application checks are created by App\Module\Access (access:sync).
fedale_rbac:
    enabled: true
    # Holders of this role pass every check.
    super_admin_role: ROLE_SUPER_ADMIN
    # Role → role edges come from auth_item_child, not from security.yaml.
    override_role_hierarchy: true
    # Assigned roles are loaded by our user provider itself.
    inject_assigned_roles: false
    provider: doctrine

    # No cache: it keeps the roles and permissions under one key for the whole installation,
    # and each tenant has its own (in its RBAC schema, see docs/architecture.md, "Tenants").
    # Back once the bundle knows about tenants.
    cache:
        enabled: false
