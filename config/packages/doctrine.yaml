doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '17'
        # Record tables in the "data" schema are owned by the Schema module, not by
        # Doctrine migrations: hide them from schema tools (diff, validate). So are
        # core.metadata_state, written by triggers only (migration Version20261107060749),
        # and core.tenant, the tenant registry, read with DBAL before any tenant is selected.
        # (The comparison names core's tables with or without their schema.)
        schema_filter: '~^(?!data(\.|$)|(core\.)?(metadata_state|tenant)$)~'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Every read of a tenant's table is restricted to the current tenant (see TenantScope).
        filters:
            tenant:
                class: App\Shared\Infrastructure\Tenant\TenantFilter
                enabled: true
        # One XML mapping per module: Domain models stay free of Doctrine attributes.
        # The ORM is used only for static core tables; dynamic records go through DBAL.
        mappings:
            Metadata:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Metadata/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\Metadata\Domain\Model'
                alias: Metadata
            Schema:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Schema/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\Schema\Domain\Model'
                alias: Schema
            File:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/File/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\File\Domain\Model'
                alias: File
            Template:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Template/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\Template\Domain\Model'
                alias: Template
            User:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/User/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\User\Domain\Model'
                alias: User

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
