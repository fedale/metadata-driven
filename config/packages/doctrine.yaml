doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '17'
        # Only core's tables are Doctrine's: hide the workspaces' schemas from the schema tools
        # (diff, validate). Their record tables are the Schema module's, their RBAC tables are
        # made with each workspace. So are core.metadata_state, written by triggers only (migration
        # Version20261107060749), and the system's tables, read with DBAL: core.workspace,
        # core.workspace_membership, core.workspace_invitation; and the runs of the workflows, written
        # with DBAL once a transaction ended (core.workflow_run, workflow_run_step, workflow_usage), and
        # their secrets and webhook tokens (core.workflow_secret, core.workflow_webhook).
        # The comparison names core's tables with or without their schema, and a workspace's with
        # theirs.
        schema_filter: '~^(?!(core\.)?(metadata_state|workspace|workspace_membership|workspace_invitation|workflow_run|workflow_run_step|workflow_usage|workflow_secret|workflow_webhook)$)(core\.)?[^.]+$~'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Every read of a workspace's table is restricted to the current workspace (see WorkspaceScope).
        filters:
            workspace:
                class: App\Shared\Infrastructure\Workspace\WorkspaceFilter
                enabled: true
        # One XML mapping per module: Domain models stay free of Doctrine attributes.
        # The ORM is used only for static core tables; dynamic records go through DBAL.
        mappings:
            Metadata:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Metadata/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\Metadata\Domain\Model'
                alias: Metadata
            Schema:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Schema/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\Schema\Domain\Model'
                alias: Schema
            File:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/File/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\File\Domain\Model'
                alias: File
            Package:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Package/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\Package\Domain\Model'
                alias: Package
            User:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/User/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\User\Domain\Model'
                alias: User
            Workflow:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Workflow/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\Workflow\Domain\Model'
                alias: Workflow

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
