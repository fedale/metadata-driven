# The workflows' runs in the background (docs/workflows.md): the worker is
# "messenger:consume async scheduler_workflows" (the second, the schedules', by one worker), the queue Redis (MESSENGER_TRANSPORT_DSN, e.g.
# redis://localhost:6379/messages; the PHP redis extension where it runs).
framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # An error outside a run's steps (the database down): tried again, then failed.
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 4
            # messenger:failed:show, messenger:failed:retry
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: failed
            sync: 'sync://'

        routing:
            App\Module\Workflow\Application\Engine\Message\RunWorkflow: async
            App\Module\Workflow\Application\Engine\Message\RunPlatformEvents: async
            App\Module\Workflow\Application\Engine\Message\ResumeRun: async
            App\Module\Workflow\Application\Engine\Message\RunScheduled: async

# The tests run the background in the request, as it comes; the runs that wait are kept, for
# the tests to resume them when they say (messenger.transport.delayed).
when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
                failed: 'in-memory://'
                delayed: 'in-memory://'
            routing:
                App\Module\Workflow\Application\Engine\Message\ResumeRun: delayed
