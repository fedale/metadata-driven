security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        # Values of the "password" field type (FieldType module).
        record_secret: 'auto'

    providers:
        # Active users by email, with their RBAC roles (fedale/rbac-bundle) reloaded on every request.
        app_users:
            id: App\Module\User\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login
            # Five tries a minute per address and email, in every tenant and on the console.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600 # 2 weeks
                # A cookie signs in to the tenant it was made in only (SecurityUser::getTenantId()),
                # and stops working when the password changes.
                signature_properties: ['password', 'tenantId']

    # Signing in is required everywhere; what a user may do is decided by the RBAC
    # permissions, checked by the controllers (App\Module\Access).
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # An invitation's link: its token is the credential (InvitationController).
        - { path: ^/invitation/, roles: PUBLIC_ACCESS }
        # The console of the installation, on its own host (HostTenantListener): its operators.
        - { path: ^/console, roles: ROLE_OPERATOR }
        # The grid UI settings (fedale/gridview-bundle) apply to every user: administrators only.
        - { path: ^/gridview/_settings, allow_if: "is_granted('ROLE_SUPER_ADMIN') or is_granted('admin.metadata')" }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            record_secret:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
