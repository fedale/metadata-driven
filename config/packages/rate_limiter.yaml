framework:
    rate_limiter:
        # The passwords tried on invitations, per account, whatever the invitation: new
        # invitations give no more guesses (UserManager::acceptInvitation()).
        invitation_password:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # The invitations an admin sends by email, per inviter: the members page and the console
        # are no way to mail a list of addresses (InvitationMail).
        invitation_email:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # "Forgot your password?", per address and per IP, each request counting for both, taken
        # before the address is looked up (PasswordResetController).
        password_reset_request:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        # The current password asked to change it, per account: a session left open is no way
        # to guess it (UserManager::changePassword()).
        password_change:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # The requests a workspace's webhooks accept, counted as they come (WebhookController):
        # the runs a minute, before any is queued.
        workflow_webhook:
            policy: sliding_window
            limit: '%app.workflow.runs_per_minute%'
            interval: '1 minute'
