# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Templates downloaded from an index: the archive, then its files once unpacked, in MB.
    app.template.max_download_mb: 50
    app.template.max_unpacked_mb: 200
    # true lets indexes and archives be on a private network (an intranet index); false refuses
    # private, loopback and link-local addresses, redirects included.
    app.template.allow_private_networks: false
    # The CSV import wizard: where the uploaded files wait between its steps (a day at most), and
    # the most rows it imports at once; a larger file goes through record:import.
    env(IMPORT_DRAFTS_DIR): '%kernel.project_dir%/var/imports'
    app.import.drafts_dir: '%env(resolve:IMPORT_DRAFTS_DIR)%'
    app.import.max_rows: 5000
    # Tenants (docs/architecture.md, "Tenants"). A request for <slug>.<base host> is for that
    # tenant's; one for the base host itself, or for any other host, and a command without
    # --tenant, are for the default tenant's. Empty: no default, every request names its tenant.
    env(TENANT_BASE_HOST): 'localhost'
    env(TENANT_DEFAULT): 'default'
    app.tenant.base_host: '%env(TENANT_BASE_HOST)%'
    app.tenant.default: '%env(TENANT_DEFAULT)%'
    # The tenant of every new database connection before a request or a command selects one.
    # Empty, so that a session nobody pointed at a tenant sees none: only the tests set it, having
    # no request or command to name one.
    app.tenant.fallback: ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Tagging is configured here (not with attributes) so that Contract and Domain
    # layers stay free of framework dependencies.
    _instanceof:
        App\Module\FieldType\Contract\FieldTypeInterface:
            tags: ['app.field_type']
        App\Module\Search\Contract\SearchHandlerInterface:
            tags: ['app.search_handler']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Module/*/Contract/Dto/'
            - '../src/Module/*/Contract/Event/'
            - '../src/Module/*/Contract/Exception/'
            - '../src/Module/*/Domain/Model/'
            - '../src/Module/*/Domain/Exception/'
            - '../src/Module/*/Application/Command/'

    # The template format (fedale/metadata-driven-template-format) is a plain library: the
    # services the Template module needs from it.
    Fedale\TemplateFormat\Archive: ~
    Fedale\TemplateFormat\DocumentCodec: ~
    Fedale\TemplateFormat\SchemaValidator: ~
    Fedale\TemplateFormat\SeedRecords: ~
    Fedale\TemplateFormat\PackageDirectory: ~
    Fedale\TemplateFormat\PackageChecker: ~
    Fedale\TemplateFormat\FieldTypes\FieldTypeCatalog: ~
    Fedale\TemplateFormat\Versions\ItemStates: ~

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # The fake template server's hosts resolve nowhere: the guard against private networks
        # would block them. TemplateSourcesTest checks the guard itself.
        app.template.allow_private_networks: true
        app.import.drafts_dir: '%kernel.cache_dir%/imports'
        # Tests have no request or command to name a tenant: every connection starts in the
        # installation's first one.
        app.tenant.fallback: 'default'
    services:
        # The Flysystem storage is injected in one service only, so the container inlines and
        # removes it; the file tests read the stored bytes from it.
        test.record_files.storage:
            alias: record_files.storage
            public: true
        App\Tests\Support\FakeTemplateServer:
            public: true
        # Used by no service yet (tenant:create will): kept for the tests creating tenants.
        App\Shared\Infrastructure\Tenant\TenantProvisioner:
            autowire: true
            public: true
        App\Shared\Infrastructure\Tenant\TenantRegistry:
            autowire: true
            public: true
