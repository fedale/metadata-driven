# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Packages downloaded from an index: the archive, then its files once unpacked, in MB.
    app.package.max_download_mb: 50
    app.package.max_unpacked_mb: 200
    # true lets indexes and archives be on a private network (an intranet index); false refuses
    # private, loopback and link-local addresses, redirects included.
    app.package.allow_private_networks: false
    # The CSV import wizard: where the uploaded files wait between its steps (a day at most), and
    # the most rows it imports at once; a larger file goes through record:import.
    env(IMPORT_DRAFTS_DIR): '%kernel.project_dir%/var/imports'
    app.import.drafts_dir: '%env(resolve:IMPORT_DRAFTS_DIR)%'
    app.import.max_rows: 5000
    # The workflows (docs/workflows.md): the longest chain of runs started by one another's writes,
    # the runs a workspace may start a minute (beyond, a write a workflow guards is refused, other
    # runs fail), and how long the runs are kept (workflow:runs:gc).
    app.workflow.max_depth: 3
    app.workflow.runs_per_minute: 100
    # The steps one run may execute, an iterator's counted (a definition holds 50 at most).
    app.workflow.max_executed_steps: 1000
    # The records one search reads, the items one iterator runs on.
    app.workflow.max_records: 200
    # The longest a run waits (the wait step).
    app.workflow.max_wait_days: 30
    # The first pause before an HTTP request is tried again, in milliseconds; doubled each time.
    app.workflow.http_retry_delay_ms: 1000
    # Never in production: an HTTP request of a workflow reaching the server's own network.
    app.workflow.allow_private_networks: false
    # The key the workflows' secrets are encrypted with: workflow:secrets:key makes one. Unset, no
    # secret is written nor read.
    app.workflow.secrets_key: '%env(default::WORKFLOW_SECRETS_KEY)%'
    app.workflow.runs_keep_days: 30
    # Workspaces (docs/architecture.md, "Workspaces"). A request for <slug>.<base host> is for that
    # workspace's; one for the base host itself, or for any other host, and a command without
    # --workspace, are for the default workspace's. Empty: no default, every request names its workspace.
    env(WORKSPACE_BASE_HOST): 'localhost'
    env(WORKSPACE_DEFAULT): 'default'
    app.workspace.base_host: '%env(WORKSPACE_BASE_HOST)%'
    app.workspace.default: '%env(WORKSPACE_DEFAULT)%'
    # The workspace of every new database connection before a request or a command selects one.
    # Empty, so that a session nobody pointed at a workspace sees none: only the tests set it, having
    # no request or command to name one.
    app.workspace.fallback: ''
    # The system console answers on <label>.<base host>, for the system admins
    # (system:admin grant); the label is no workspace's slug. Empty: no console.
    app.workspace.console_label: 'console'
    # The RBAC role that passes every check (fedale_rbac.yaml); workspace:create gives it to a new
    # workspace's first admin. App\Module\Access\Contract\Permissions::SUPER_ADMIN_ROLE says the same.
    app.super_admin_role: 'ROLE_SUPER_ADMIN'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Tagging is configured here (not with attributes) so that Contract and Domain
    # layers stay free of framework dependencies.
    _instanceof:
        App\Module\FieldType\Contract\FieldTypeInterface:
            tags: ['app.field_type']
        App\Module\Search\Contract\SearchHandlerInterface:
            tags: ['app.search_handler']
        App\Module\Record\Contract\RecordActionsInterface:
            tags: ['app.record_actions']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Module/*/Contract/Dto/'
            - '../src/Module/*/Contract/Event/'
            - '../src/Module/*/Contract/Exception/'
            - '../src/Module/*/Domain/Model/'
            - '../src/Module/*/Domain/Exception/'
            - '../src/Module/*/Application/Command/'

    # The package format (fedale/metadata-driven-package-format) is a plain library: the
    # services the Package module needs from it.
    Fedale\PackageFormat\Archive: ~
    Fedale\PackageFormat\DocumentCodec: ~
    Fedale\PackageFormat\SchemaValidator: ~
    Fedale\PackageFormat\SeedRecords: ~
    Fedale\PackageFormat\PackageDirectory: ~
    Fedale\PackageFormat\PackageChecker: ~
    Fedale\PackageFormat\FieldTypes\FieldTypeCatalog: ~
    Fedale\PackageFormat\Versions\ItemStates: ~

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # The fake package server's hosts resolve nowhere: the guard against private networks
        # would block them. PackageSourcesTest checks the guard itself.
        app.package.allow_private_networks: true
        app.workflow.allow_private_networks: true
        # The tests' own key: never one of an installation's.
        app.workflow.secrets_key: 'dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtMzI='
        app.workflow.http_retry_delay_ms: 0
        app.import.drafts_dir: '%kernel.cache_dir%/imports'
        # Tests have no request or command to name a workspace: every connection starts in the
        # installation's first one.
        app.workspace.fallback: 'default'
    services:
        # The Flysystem storage is injected in one service only, so the container inlines and
        # removes it; the file tests read the stored bytes from it.
        test.record_files.storage:
            alias: record_files.storage
            public: true
        App\Tests\Support\FakePackageServer:
            public: true
        # Used by no service yet (workspace:create will): kept for the tests creating workspaces.
        App\Shared\Infrastructure\Workspace\WorkspaceProvisioner:
            autowire: true
            public: true
        App\Shared\Infrastructure\Workspace\WorkspaceRegistry:
            autowire: true
            public: true
