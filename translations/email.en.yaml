# The texts of the application's emails (templates/email/), in English.
footer:
    automatic: 'This email was sent automatically: replies are not read.'
mail_test:
    subject: 'A test email'
    body: 'This is a test email: the application sends email.'
    sent_at: 'Sent at %at% (UTC).'
invitation:
    subject: '%inviter% invites you to %workspace%'
    body: '%inviter% invites you to %workspace%. Accept with the password of your account if you have one, or create one.'
    accept: 'Accept the invitation'
    link: 'Or open this address:'
    expires: 'The invitation works until %date% (UTC). If you did not expect it, ignore this email: nothing happens.'
password_reset:
    subject: 'Choose a new password'
    body: 'Someone asked to reset the password of your account. If it was you, choose a new one: every other session of the account ends.'
    choose: 'Choose a new password'
    link: 'Or open this address:'
    expires: 'The link works once, until %date% (UTC). If you did not ask, ignore this email: your password stays as it is.'
notification:
    subject: '%title%'
    open: 'Open'
    why: 'You get your notifications by email too, as chosen on your account page:'
    account: 'change it there'
workflow_email:
    subject: '%subject%'
