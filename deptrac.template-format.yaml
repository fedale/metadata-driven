# The template format stands alone: App\TemplateFormat may use itself and the libraries below,
# nothing else of the app or of the framework. It is meant to move into a package of its own,
# fedale/template-format, when the template catalog starts (docs/internal/template-plan.md).
# Run: vendor/bin/deptrac analyse --config-file=deptrac.template-format.yaml
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#src/Kernel\.php$#'

  layers:
    - name: TemplateFormat
      collectors:
        - { type: directory, value: src/TemplateFormat/.* }

    # The rest of the app: modules, the shared kernel.
    - name: App
      collectors:
        - type: bool
          must: [{ type: classNameRegex, value: '#^App\\#' }]
          must_not: [{ type: directory, value: src/TemplateFormat/.* }]

    # The libraries the format may use: YAML, JSON Schema.
    - name: FormatLibraries
      collectors:
        - { type: classNameRegex, value: '#^(Symfony\\Component\\Yaml|Opis\\JsonSchema)\\#' }

    # Every other library: the framework, Doctrine, the user's bundles.
    - name: OtherLibraries
      collectors:
        - type: bool
          must: [{ type: classNameRegex, value: '#^(Symfony|Doctrine|Fedale|League|Imagine|Psr|Twig)\\#' }]
          must_not: [{ type: classNameRegex, value: '#^Symfony\\Component\\Yaml\\#' }]

  ruleset:
    TemplateFormat: [FormatLibraries]
    App: [TemplateFormat, FormatLibraries, OtherLibraries]
